name: AIOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff

    - name: Lint with Ruff
      run: |
        # Проверка синтаксиса и стиля (можно добавить --fix для автоисправления)
        ruff check .
        ruff format --check .

    - name: Test with pytest
      run: |
        # Запускаем тесты с выводом подробной информации и покрытием
        pytest tests/ -v --tb=short
      env:
        # Передаем фиктивные ключи для тестов, чтобы они не падали из-за их отсутствия
        LLM_API_KEY: "test_dummy_key"
