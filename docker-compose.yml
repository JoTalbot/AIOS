version: "3.8"

services:
  traefik:
    image: traefik:v2.11
    container_name: aios-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
    networks:
      - aios_network
    restart: unless-stopped

  aios-core:
    build: .
    container_name: aios-core
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aios.rule=Host(`aios.local`)"
      - "traefik.http.services.aios.loadbalancer.server.port=8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aios:aios@postgres:5432/aios
      - REDIS_HOST=redis
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - aios_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: aios-postgres
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aios_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aios-redis
    networks:
      - aios_network
    restart: unless-stopped

  arq-worker:
    build: .
    container_name: aios-arq-worker
    command: arq aios_core.tasks.worker.WorkerSettings
    env_file: .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - aios_network
    restart: unless-stopped

networks:
  aios_network:
    driver: bridge

volumes:
  pgdata:
