[Unit]
After=aios-chrome-colab-secondary.service
Requires=aios-chrome-colab-secondary.service

[Service]
Environment=COLAB_SERVICE_KIND=llm
Environment=COLAB_SERVICE_NAME=colab-llm-secondary
Environment=COLAB_NODE_ID=google-secondary
Environment=COLAB_CDP_URL=http://127.0.0.1:9223
Environment=COLAB_CHROME_PROFILE=/root/AIOS/data/chrome_twin/google_secondary
Environment=COLAB_TUNNEL_WAIT_ATTEMPTS=100
EnvironmentFile=-/root/AIOS/data/.colab_llm.env
