name: AIOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    # Legacy/advisory job; the blocking surface is core-gate.yml.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff

    - name: Validate Python compilation and Compose configuration
      run: |
        python -m compileall -q aios_core aios_cli run_telegram_bot.py run_coder_orchestrator.py
        AIOS_API_KEYS={ci:subject:ci} GRAFANA_PASSWORD=ci docker compose -f docker-compose.prod.yml config -q

    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Test with pytest
      run: |
        pytest tests/ -v --tb=short
      env:
        LLM_API_KEY: "test_dummy_key"
        OLX_WEBHOOK_SECRET: "test_secret"


  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - name: Scan tracked repository history for secrets
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
