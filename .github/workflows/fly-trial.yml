name: Deploy Fly.io Trial

# Только ручной запуск, чтобы изменения в main не расходовали Fly.io Trial.
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Уникальное имя приложения Fly.io"
        required: true
        default: "jotalbot-aios-trial-2026"
        type: string

permissions:
  contents: read

concurrency:
  group: fly-trial-deploy
  cancel-in-progress: true

jobs:
  check-token:
    name: Проверка токена Fly.io
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.token.outputs.configured }}
    steps:
      - name: Проверить FLY_API_TOKEN
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN не настроен — деплой пропущен."
          fi

  deploy:
    name: Развернуть облегчённый AIOS
    needs: check-token
    if: needs.check-token.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      FLY_APP_NAME: ${{ inputs.app_name }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Проверить имя приложения
        run: |
          if ! [[ "$FLY_APP_NAME" =~ ^[a-z0-9][a-z0-9-]{2,28}[a-z0-9]$ ]]; then
            echo "Некорректное имя Fly.io: $FLY_APP_NAME" >&2
            exit 1
          fi

      - name: Создать приложение при отсутствии
        run: |
          if flyctl status --app "$FLY_APP_NAME" >/dev/null 2>&1; then
            echo "Приложение $FLY_APP_NAME уже существует."
          else
            echo "Приложение $FLY_APP_NAME не найдено, создаю..."
            flyctl apps create "$FLY_APP_NAME"
          fi

      - name: Выполнить remote deploy
        run: flyctl deploy --remote-only --ha=false --config fly.toml --app "$FLY_APP_NAME"

      - name: Проверить статус приложения
        run: flyctl status --app "$FLY_APP_NAME"

      - name: Проверить health endpoint
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "https://${FLY_APP_NAME}.fly.dev/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health endpoint не ответил вовремя." >&2
          exit 1
