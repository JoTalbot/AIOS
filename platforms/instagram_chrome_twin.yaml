name: instagram_chrome_twin
android_package: com.android.chrome
agent_module: aios_core.platforms.instagram_chrome_twin_adapter
storage_class: null
adb_class: null
default_locale: uk-UA
description: "Instagram (Meta) via Chrome Twin — использует залогиненную сессию Instagram в профиле data/chrome_twin/default/ (там же залогинен Google-аккаунт jo.talbot@gmail.com). Read-only: профиль, подписчики, посты. Автоматизация через Playwright."
legacy_default_db: instagram_chrome_twin_default.sqlite
extras:
  compliance:
    autopost_allowed: false
    messenger: false
    collector: true
    actions_per_hour: 60
    note: "Instagram Chrome Twin: read-only сбор данных профиля и постов из уже залогиненной сессии. Без постинга и без авто-действий (ToS)."
  instagram:
    google_account: "jo.talbot@gmail.com"
    session: "manual login via VNC, cookies in profile"
  browser:
    user_data_dir: "data/chrome_twin/default"
    headless: false
    slow_mo: 150
