version: "3.8"
services:
  # Placeholder for Prometheus Node Exporter (Monitoring)
  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    deploy:
      mode: global # Runs exactly one task on every node
      restart_policy:
        condition: on-failure

  # Simulate reverse proxy routing to ubu-worker
  ollama_proxy:
    image: nginx:alpine
    ports:
      - "11435:80"
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
