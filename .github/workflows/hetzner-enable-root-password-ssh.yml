name: Enable Hetzner Root Password SSH

# Включает root/password SSH через одноразовую загрузку Hetzner Rescue.
# Операция перезагружает сервер. Итоговый пароль передаётся только в
# зашифрованном artifact и никогда не выводится в публичные логи.
on:
  workflow_dispatch:
    inputs:
      server_name:
        description: "Имя сервера Hetzner"
        required: true
        default: "aios"
        type: string
      confirmation:
        description: "Для подтверждения перезагрузки введите ENABLE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hetzner-enable-root-password-ssh
  cancel-in-progress: false

jobs:
  enable-password-ssh:
    name: Включить root/password SSH
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение и секреты
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          RESULT_KEY: ${{ secrets.HETZNER_RESULT_KEY }}
        run: |
          if [ "$CONFIRMATION" != "ENABLE" ]; then
            echo "Операция не подтверждена: требуется значение ENABLE." >&2
            exit 1
          fi
          if [ -z "$HETZNER_API" ]; then
            echo "Секрет HERTZNER_API не настроен." >&2
            exit 1
          fi
          if [ -z "$RESULT_KEY" ]; then
            echo "Временный секрет HETZNER_RESULT_KEY не настроен." >&2
            exit 1
          fi

      - name: Включить Rescue и перезагрузить сервер
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          SERVER_NAME: ${{ inputs.server_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import secrets
          import string
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["HETZNER_API"]
          server_name = os.environ["SERVER_NAME"].strip()
          api_base = "https://api.hetzner.cloud/v1"
          pattern = re.compile(
              r"^(?=.{1,63}$)[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$"
          )
          if not pattern.fullmatch(server_name):
              raise SystemExit("Некорректное имя сервера.")

          def api_request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-SSH-Configurator/1.0",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{api_base}{path}", data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Hetzner API вернул HTTP {error.code}: {detail}"
                  ) from error

          def wait_action(action_id, timeout=180):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  action = api_request("GET", f"/actions/{action_id}")["action"]
                  if action.get("status") == "success":
                      return
                  if action.get("status") == "error":
                      raise RuntimeError(f"Hetzner action failed: {action.get('error')}")
                  time.sleep(2)
              raise TimeoutError(f"Hetzner action {action_id} timed out.")

          query = urllib.parse.quote(server_name, safe="")
          matches = api_request(
              "GET", f"/servers?name={query}&per_page=50"
          ).get("servers", [])
          servers = [server for server in matches if server.get("name") == server_name]
          if len(servers) != 1:
              raise SystemExit(
                  f"Ожидался один сервер {server_name!r}, найдено: {len(servers)}."
              )
          server = servers[0]
          ipv4 = ((server.get("public_net") or {}).get("ipv4") or {}).get("ip")
          if not ipv4:
              raise SystemExit("У сервера отсутствует публичный IPv4.")

          rescue = api_request(
              "POST",
              f"/servers/{server['id']}/actions/enable_rescue",
              {"type": "linux64", "ssh_keys": []},
          )
          wait_action(rescue["action"]["id"])
          rescue_password = rescue.get("root_password")
          if not rescue_password:
              raise RuntimeError("Hetzner API не вернул пароль Rescue.")

          alphabet = string.ascii_letters + string.digits
          new_password = "".join(secrets.choice(alphabet) for _ in range(20))
          print(f"::add-mask::{rescue_password}")
          print(f"::add-mask::{new_password}")
          Path("/tmp/hetzner-rescue-password").write_text(
              rescue_password, encoding="utf-8"
          )
          Path("/tmp/hetzner-new-root-password").write_text(
              new_password, encoding="utf-8"
          )
          Path("/tmp/hetzner-rescue-password").chmod(0o600)
          Path("/tmp/hetzner-new-root-password").chmod(0o600)
          Path("/tmp/hetzner-ssh-context.json").write_text(
              json.dumps(
                  {"server_id": server["id"], "server_name": server_name, "ipv4": ipv4}
              ),
              encoding="utf-8",
          )

          reboot = api_request(
              "POST", f"/servers/{server['id']}/actions/reboot", {}
          )
          wait_action(reboot["action"]["id"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SERVER_ID={server['id']}\n")
              env_file.write(f"SERVER_NAME={server_name}\n")
              env_file.write(f"SERVER_IP={ipv4}\n")
          print("Rescue включён; сервер перезагружен.")
          PY

      - name: Установить SSH-клиент для парольной авторизации
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Настроить установленную Ubuntu из Rescue
        run: |
          set -euo pipefail
          # Rescue получает новый временный host key после перезагрузки. Не
          # сохраняем ключ предыдущей ОС, иначе ранняя попытка подключения
          # блокирует все последующие попытки из-за host key mismatch.
          SSH_OPTIONS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=10
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
          )

          rescue_ready=0
          for attempt in {1..36}; do
            if sshpass -f /tmp/hetzner-rescue-password \
              ssh "${SSH_OPTIONS[@]}" root@"$SERVER_IP" \
              'test -x /usr/sbin/chroot-prepare' >/dev/null 2>&1; then
              rescue_ready=1
              break
            fi
            sleep 5
          done
          if [ "$rescue_ready" -ne 1 ]; then
            echo "Не удалось подключиться к Hetzner Rescue." >&2
            exit 1
          fi

          sshpass -f /tmp/hetzner-rescue-password \
            scp "${SSH_OPTIONS[@]}" \
            /tmp/hetzner-new-root-password \
            root@"$SERVER_IP":/tmp/aios-new-root-password

          sshpass -f /tmp/hetzner-rescue-password \
            ssh "${SSH_OPTIONS[@]}" root@"$SERVER_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT_DEVICE=$(lsblk -pnro NAME,FSTYPE,TYPE | awk \
            '$3 == "part" && ($2 == "ext4" || $2 == "xfs") {print $1; exit}')
          if [ -z "$ROOT_DEVICE" ] || [ ! -b "$ROOT_DEVICE" ]; then
            echo "Не удалось определить корневой раздел установленной ОС." >&2
            exit 1
          fi

          MOUNT_POINT=/mnt/aios-root
          mkdir -p "$MOUNT_POINT"
          mount "$ROOT_DEVICE" "$MOUNT_POINT"
          if [ ! -f "$MOUNT_POINT/etc/os-release" ]; then
            echo "На выбранном разделе не обнаружена установленная ОС." >&2
            umount "$MOUNT_POINT"
            exit 1
          fi

          chroot-prepare "$MOUNT_POINT"
          mkdir -p "$MOUNT_POINT/etc/ssh/sshd_config.d"
          cat >"$MOUNT_POINT/etc/ssh/sshd_config.d/00-aios-password-auth.conf" <<'CONFIG'
          PasswordAuthentication yes
          PermitRootLogin yes
          KbdInteractiveAuthentication no
          CONFIG
          chmod 0644 "$MOUNT_POINT/etc/ssh/sshd_config.d/00-aios-password-auth.conf"

          if ! grep -Eq '^Include[[:space:]]+/etc/ssh/sshd_config\.d/\*\.conf' \
            "$MOUNT_POINT/etc/ssh/sshd_config"; then
            sed -i '1i Include /etc/ssh/sshd_config.d/*.conf' \
              "$MOUNT_POINT/etc/ssh/sshd_config"
          fi

          NEW_PASSWORD=$(cat /tmp/aios-new-root-password)
          printf 'root:%s\n' "$NEW_PASSWORD" | chroot "$MOUNT_POINT" /usr/sbin/chpasswd
          unset NEW_PASSWORD
          mkdir -p "$MOUNT_POINT/run/sshd"
          chroot "$MOUNT_POINT" /usr/sbin/sshd -t
          rm -f /tmp/aios-new-root-password
          sync
          umount -R "$MOUNT_POINT" || true
          echo "Конфигурация установленной Ubuntu обновлена."
          REMOTE

      - name: Отключить Rescue и загрузить сервер с диска
        # Гарантированно возвращаем сервер к системному диску даже при ошибке
        # настройки, чтобы узел не оставался в Rescue.
        if: always()
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ["HETZNER_API"]
          server_id = os.environ.get("SERVER_ID", "").strip()
          if not server_id:
              print("SERVER_ID отсутствует; Rescue не успел включиться.")
              raise SystemExit(0)
          api_base = "https://api.hetzner.cloud/v1"

          def api_request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-SSH-Configurator/1.0",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{api_base}{path}", data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Hetzner API вернул HTTP {error.code}: {detail}"
                  ) from error

          def wait_action(action_id, timeout=180):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  action = api_request("GET", f"/actions/{action_id}")["action"]
                  if action.get("status") == "success":
                      return
                  if action.get("status") == "error":
                      raise RuntimeError(f"Hetzner action failed: {action.get('error')}")
                  time.sleep(2)
              raise TimeoutError(f"Hetzner action {action_id} timed out.")

          disabled = api_request(
              "POST", f"/servers/{server_id}/actions/disable_rescue", {}
          )
          wait_action(disabled["action"]["id"])
          rebooted = api_request("POST", f"/servers/{server_id}/actions/reboot", {})
          wait_action(rebooted["action"]["id"])
          print("Rescue отключён; сервер загружается с системного диска.")
          PY

      - name: Проверить вход root по паролю
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=10
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
          )
          password_login_ok=0
          for attempt in {1..36}; do
            if sshpass -f /tmp/hetzner-new-root-password \
              ssh "${SSH_OPTIONS[@]}" root@"$SERVER_IP" \
              'test "$(id -u)" = "0"' >/dev/null 2>&1; then
              password_login_ok=1
              break
            fi
            sleep 5
          done
          if [ "$password_login_ok" -ne 1 ]; then
            echo "Сервер загрузился, но парольный SSH-вход не прошёл проверку." >&2
            exit 1
          fi
          echo "Парольный SSH-вход root успешно проверен."

      - name: Подготовить и зашифровать результат
        env:
          RESULT_KEY: ${{ secrets.HETZNER_RESULT_KEY }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          result = {
              "generated_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "server": {
                  "id": int(os.environ["SERVER_ID"]),
                  "name": os.environ["SERVER_NAME"],
                  "ipv4": os.environ["SERVER_IP"],
              },
              "username": "root",
              "root_password": Path("/tmp/hetzner-new-root-password").read_text(
                  encoding="utf-8"
              ),
              "password_ssh_verified": True,
          }
          Path("/tmp/hetzner-password-ssh-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/hetzner-password-ssh-result.json \
            -out /tmp/hetzner-password-ssh-result.enc \
            -pass env:RESULT_KEY
          rm -f /tmp/hetzner-password-ssh-result.json

      - name: Загрузить зашифрованный результат
        uses: actions/upload-artifact@v4
        with:
          name: hetzner-password-ssh-result-encrypted
          path: /tmp/hetzner-password-ssh-result.enc
          if-no-files-found: error
          retention-days: 1

      - name: Удалить временные пароли с runner
        if: always()
        run: |
          rm -f \
            /tmp/hetzner-rescue-password \
            /tmp/hetzner-new-root-password \
            /tmp/hetzner-ssh-context.json \
            /tmp/hetzner-password-ssh-result.json \
            /tmp/hetzner-password-ssh-result.enc \
            /tmp/hetzner-rescue-known-hosts \
            /tmp/hetzner-system-known-hosts
