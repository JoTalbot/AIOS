name: Add SSH Key to Hetzner Server

# Добавляет постоянный SSH-ключ в Hetzner Project и на существующий сервер.
# Для доступа к диску используется одноразовый Rescue-ключ, который удаляется
# после операции. Парольный SSH-вход явно отключается.
on:
  workflow_dispatch:
    inputs:
      server_name:
        description: "Имя сервера Hetzner"
        required: true
        default: "aios"
        type: string
      key_name:
        description: "Имя постоянного ключа в Hetzner Project"
        required: true
        default: "aios-user-ed25519"
        type: string
      public_key:
        description: "Публичный SSH-ключ ed25519"
        required: true
        type: string
      confirmation:
        description: "Для подтверждения перезагрузки введите ADD"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hetzner-add-ssh-key
  cancel-in-progress: false

jobs:
  add-key:
    name: Добавить SSH-ключ и отключить парольный вход
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение и API-токен
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          HETZNER_API: ${{ secrets.HERTZNER_API }}
        run: |
          if [ "$CONFIRMATION" != "ADD" ]; then
            echo "Операция не подтверждена: требуется значение ADD." >&2
            exit 1
          fi
          if [ -z "$HETZNER_API" ]; then
            echo "Секрет HERTZNER_API не настроен." >&2
            exit 1
          fi

      - name: Подготовить ключи и загрузить Hetzner Rescue
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          SERVER_NAME_INPUT: ${{ inputs.server_name }}
          KEY_NAME_INPUT: ${{ inputs.key_name }}
          PUBLIC_KEY_INPUT: ${{ inputs.public_key }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["HETZNER_API"]
          server_name = os.environ["SERVER_NAME_INPUT"].strip()
          key_name = os.environ["KEY_NAME_INPUT"].strip()
          public_key = " ".join(os.environ["PUBLIC_KEY_INPUT"].strip().split())
          api_base = "https://api.hetzner.cloud/v1"

          hostname_pattern = re.compile(
              r"^(?=.{1,63}$)[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$"
          )
          key_name_pattern = re.compile(r"^[a-zA-Z0-9._-]{1,64}$")
          if not hostname_pattern.fullmatch(server_name):
              raise SystemExit("Некорректное имя сервера.")
          if not key_name_pattern.fullmatch(key_name):
              raise SystemExit("Некорректное имя SSH-ключа.")

          parts = public_key.split()
          if len(parts) < 2 or parts[0] != "ssh-ed25519":
              raise SystemExit("Ожидается публичный ключ формата ssh-ed25519.")
          try:
              decoded = base64.b64decode(parts[1], validate=True)
          except ValueError as error:
              raise SystemExit("Некорректная Base64-часть публичного ключа.") from error
          if len(decoded) < 32:
              raise SystemExit("Публичный SSH-ключ слишком короткий.")
          key_material = f"{parts[0]} {parts[1]}"
          Path("/tmp/aios-user-key.pub").write_text(
              key_material + "\n", encoding="utf-8"
          )

          def api_request(method, path, payload=None, expect_json=True):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-SSH-Key-Manager/1.0",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{api_base}{path}", data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      if not expect_json:
                          return {"status": response.status}
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Hetzner API вернул HTTP {error.code}: {detail}"
                  ) from error

          def wait_action(action_id, timeout=180):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  action = api_request("GET", f"/actions/{action_id}")["action"]
                  if action.get("status") == "success":
                      return
                  if action.get("status") == "error":
                      raise RuntimeError(f"Hetzner action failed: {action.get('error')}")
                  time.sleep(2)
              raise TimeoutError(f"Hetzner action {action_id} timed out.")

          def list_all(path, collection):
              items = []
              page = 1
              while True:
                  payload = api_request("GET", f"{path}?page={page}&per_page=50")
                  items.extend(payload.get(collection, []))
                  next_page = (
                      payload.get("meta", {})
                      .get("pagination", {})
                      .get("next_page")
                  )
                  if not next_page:
                      return items
                  page = int(next_page)

          query = urllib.parse.quote(server_name, safe="")
          matches = api_request(
              "GET", f"/servers?name={query}&per_page=50"
          ).get("servers", [])
          servers = [server for server in matches if server.get("name") == server_name]
          if len(servers) != 1:
              raise SystemExit(
                  f"Ожидался один сервер {server_name!r}, найдено: {len(servers)}."
              )
          server = servers[0]
          ipv4 = ((server.get("public_net") or {}).get("ipv4") or {}).get("ip")
          if not ipv4:
              raise SystemExit("У сервера отсутствует публичный IPv4.")

          # Добавляем пользовательский ключ в Hetzner Project идемпотентно.
          project_keys = list_all("/ssh_keys", "ssh_keys")
          persistent_key = None
          for existing in project_keys:
              existing_parts = (existing.get("public_key") or "").split()
              existing_material = " ".join(existing_parts[:2])
              if existing_material == key_material:
                  persistent_key = existing
                  break
          if persistent_key is None:
              persistent_key = api_request(
                  "POST",
                  "/ssh_keys",
                  {"name": key_name, "public_key": key_material},
              )["ssh_key"]

          # Одноразовый ключ нужен только для автоматизации Rescue.
          private_key = Path("/tmp/hetzner-rescue-ephemeral")
          subprocess.run(
              [
                  "ssh-keygen",
                  "-q",
                  "-t",
                  "ed25519",
                  "-N",
                  "",
                  "-f",
                  str(private_key),
              ],
              check=True,
          )
          ephemeral_public = private_key.with_suffix(".pub").read_text(
              encoding="utf-8"
          ).strip()
          ephemeral_name = (
              f"aios-rescue-{os.environ.get('GITHUB_RUN_ID', 'manual')}-"
              f"{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}"
          )
          ephemeral_key = api_request(
              "POST",
              "/ssh_keys",
              {"name": ephemeral_name, "public_key": ephemeral_public},
          )["ssh_key"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SERVER_ID={server['id']}\n")
              env_file.write(f"SERVER_NAME={server_name}\n")
              env_file.write(f"SERVER_IP={ipv4}\n")
              env_file.write(f"RESCUE_SSH_KEY_ID={ephemeral_key['id']}\n")
              env_file.write(f"PERSISTENT_SSH_KEY_ID={persistent_key['id']}\n")
              env_file.write(f"PERSISTENT_SSH_KEY_NAME={persistent_key['name']}\n")
              env_file.write(f"PERSISTENT_SSH_KEY_FINGERPRINT={persistent_key['fingerprint']}\n")

          rescue = api_request(
              "POST",
              f"/servers/{server['id']}/actions/enable_rescue",
              {"type": "linux64", "ssh_keys": [ephemeral_key["id"]]},
          )
          wait_action(rescue["action"]["id"])
          reboot = api_request(
              "POST", f"/servers/{server['id']}/actions/reboot", {}
          )
          wait_action(reboot["action"]["id"])
          print("Постоянный ключ зарегистрирован; Rescue загружается.")
          PY

      - name: Добавить ключ на системный диск
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -i /tmp/hetzner-rescue-ephemeral
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=10
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
          )

          rescue_ready=0
          for attempt in {1..36}; do
            if ssh "${SSH_OPTIONS[@]}" root@"$SERVER_IP" \
              'command -v chroot-prepare >/dev/null' >/dev/null 2>&1; then
              rescue_ready=1
              break
            fi
            sleep 5
          done
          if [ "$rescue_ready" -ne 1 ]; then
            echo "Не удалось подключиться к Hetzner Rescue." >&2
            exit 1
          fi

          scp "${SSH_OPTIONS[@]}" \
            /tmp/aios-user-key.pub \
            root@"$SERVER_IP":/tmp/aios-user-key.pub

          ssh "${SSH_OPTIONS[@]}" root@"$SERVER_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT_DEVICE=$(lsblk -pnro NAME,FSTYPE,TYPE | awk \
            '$3 == "part" && ($2 == "ext4" || $2 == "xfs") {print $1; exit}')
          if [ -z "$ROOT_DEVICE" ] || [ ! -b "$ROOT_DEVICE" ]; then
            echo "Не удалось определить корневой раздел установленной ОС." >&2
            exit 1
          fi

          MOUNT_POINT=/mnt/aios-root
          mkdir -p "$MOUNT_POINT"
          mount "$ROOT_DEVICE" "$MOUNT_POINT"
          if [ ! -f "$MOUNT_POINT/etc/os-release" ]; then
            echo "На выбранном разделе не обнаружена установленная ОС." >&2
            umount "$MOUNT_POINT"
            exit 1
          fi

          chroot-prepare "$MOUNT_POINT"
          install -d -m 0700 "$MOUNT_POINT/root/.ssh"
          touch "$MOUNT_POINT/root/.ssh/authorized_keys"
          chmod 0600 "$MOUNT_POINT/root/.ssh/authorized_keys"
          USER_KEY=$(awk '{print $1 " " $2}' /tmp/aios-user-key.pub)
          if ! grep -Fqx "$USER_KEY" "$MOUNT_POINT/root/.ssh/authorized_keys"; then
            printf '%s\n' "$USER_KEY" >>"$MOUNT_POINT/root/.ssh/authorized_keys"
          fi
          chown -R 0:0 "$MOUNT_POINT/root/.ssh"

          # Явно оставляем только ключевую аутентификацию root.
          rm -f "$MOUNT_POINT/etc/ssh/sshd_config.d/00-aios-password-auth.conf"
          mkdir -p "$MOUNT_POINT/etc/ssh/sshd_config.d"
          cat >"$MOUNT_POINT/etc/ssh/sshd_config.d/00-aios-key-only.conf" <<'CONFIG'
          PasswordAuthentication no
          PermitRootLogin prohibit-password
          KbdInteractiveAuthentication no
          CONFIG
          chmod 0644 "$MOUNT_POINT/etc/ssh/sshd_config.d/00-aios-key-only.conf"
          if ! grep -Eq '^Include[[:space:]]+/etc/ssh/sshd_config\.d/\*\.conf' \
            "$MOUNT_POINT/etc/ssh/sshd_config"; then
            sed -i '1i Include /etc/ssh/sshd_config.d/*.conf' \
              "$MOUNT_POINT/etc/ssh/sshd_config"
          fi

          mkdir -p "$MOUNT_POINT/run/sshd"
          chroot "$MOUNT_POINT" /usr/sbin/sshd -t
          EFFECTIVE=$(chroot "$MOUNT_POINT" /usr/sbin/sshd -T)
          printf '%s\n' "$EFFECTIVE" | grep -Eq '^passwordauthentication no$'
          printf '%s\n' "$EFFECTIVE" | grep -Eq \
            '^permitrootlogin (without-password|prohibit-password)$'
          grep -Fqx "$USER_KEY" "$MOUNT_POINT/root/.ssh/authorized_keys"
          unset USER_KEY EFFECTIVE
          rm -f /tmp/aios-user-key.pub
          sync
          umount -R "$MOUNT_POINT" || true
          echo "Публичный ключ добавлен; парольный SSH-вход отключён."
          REMOTE

      - name: Отключить Rescue и загрузить сервер с диска
        if: always()
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ["HETZNER_API"]
          server_id = os.environ.get("SERVER_ID", "").strip()
          if not server_id:
              print("SERVER_ID отсутствует; Rescue не успел включиться.")
              raise SystemExit(0)
          api_base = "https://api.hetzner.cloud/v1"

          def api_request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-SSH-Key-Manager/1.0",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{api_base}{path}", data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Hetzner API вернул HTTP {error.code}: {detail}"
                  ) from error

          def wait_action(action_id, timeout=180):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  action = api_request("GET", f"/actions/{action_id}")["action"]
                  if action.get("status") == "success":
                      return
                  if action.get("status") == "error":
                      raise RuntimeError(f"Hetzner action failed: {action.get('error')}")
                  time.sleep(2)
              raise TimeoutError(f"Hetzner action {action_id} timed out.")

          disabled = api_request(
              "POST", f"/servers/{server_id}/actions/disable_rescue", {}
          )
          wait_action(disabled["action"]["id"])
          rebooted = api_request("POST", f"/servers/{server_id}/actions/reboot", {})
          wait_action(rebooted["action"]["id"])
          print("Rescue отключён; сервер загружается с системного диска.")
          PY

      - name: Удалить одноразовый Rescue-ключ
        if: always()
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          key_id = os.environ.get("RESCUE_SSH_KEY_ID", "").strip()
          if not key_id:
              print("Одноразовый SSH-ключ не создавался.")
              raise SystemExit(0)
          request = urllib.request.Request(
              f"https://api.hetzner.cloud/v1/ssh_keys/{key_id}",
              method="DELETE",
              headers={
                  "Authorization": f"Bearer {os.environ['HETZNER_API']}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-SSH-Key-Manager/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status != 204:
                      raise RuntimeError(
                          f"Неожиданный статус удаления SSH-ключа: {response.status}"
                      )
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          print("Одноразовый Rescue-ключ удалён.")
          PY

      - name: Проверить доступность SSH
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            if timeout 5 bash -c "</dev/tcp/$SERVER_IP/22" 2>/dev/null; then
              echo "SSH-порт доступен."
              echo "Сервер: $SERVER_NAME ($SERVER_IP)"
              echo "Hetzner SSH key: $PERSISTENT_SSH_KEY_NAME"
              echo "Fingerprint: $PERSISTENT_SSH_KEY_FINGERPRINT"
              exit 0
            fi
            sleep 5
          done
          echo "SSH-порт не стал доступен после перезагрузки." >&2
          exit 1

      - name: Удалить временные файлы runner
        if: always()
        run: |
          rm -f \
            /tmp/hetzner-rescue-ephemeral \
            /tmp/hetzner-rescue-ephemeral.pub \
            /tmp/aios-user-key.pub
