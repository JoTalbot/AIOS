name: Deploy Documentation (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'VERSION'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Read canonical project version
        id: project-version
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer in VERSION: $VERSION_VALUE" >&2
            exit 1
          fi
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"

      - name: Install MkDocs dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-minify-plugin mike

      - name: Deploy to GitHub Pages
        env:
          DOCS_VERSION: ${{ steps.project-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases "$DOCS_VERSION" latest
