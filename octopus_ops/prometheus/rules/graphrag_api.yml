groups:
  - name: octopus_graphrag_api
    rules:
      - alert: OctopusGraphRAGApiDown
        expr: up{job="graphrag_api"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Octopus GraphRAG API scrape is down"
          description: "Prometheus cannot scrape 127.0.0.1:9760 for 5 minutes."
      - alert: OctopusGraphRAGEdgesZero
        expr: octopus_graphrag_edges == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "GraphRAG edge count is zero"
