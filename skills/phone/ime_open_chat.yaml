# iMe Messenger: открыть чат с контактом (без отправки).
# params: contact — имя контакта в адресной книге.
id: ime_open_chat
title: "iMe: открыть чат"
app: ime
params: [contact]
confirm: true
sensitive: false
steps:
  - id: open_app
    do: app.open
    package: com.iMe.android
    fresh: true            # не продолжать открытую сессию (чат), стартовать с главного экрана

  - id: dismiss_promo
    do: ui.key
    keycode: KEYCODE_BACK   # закрыть промо-шаттер «Подарить Premium» после старта
    optional: true

  - id: wait_home
    do: ui.wait
    timeout: 12
    optional: true          # холодный старт может показать splash
    selectors:
      - {desc_contains: "Search"}
      - {desc_contains: "Поиск"}
      - {resource: "com.iMe.android:id/menu_search"}

  - id: open_search
    do: ui.tap
    timeout: 8
    heal: true
    heal_hint: "the search bar or search icon at the top of the iMe chats list"
    selectors:
      - {resource: "com.iMe.android:id/menu_search"}
      - {desc_contains: "Поиск чатов"}
      - {desc_contains: "Поиск"}

  - id: type_contact
    do: ui.type
    text: "${contact}"

  - id: open_result
    do: ui.tap
    timeout: 14
    heal: true
    heal_hint: "the chat search result row titled ${contact}"
    selectors:
      - {text: "${contact}"}
      - {text_contains: "${contact}"}
