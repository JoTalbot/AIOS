[Service]
ExecStart=
ExecStart=/usr/bin/xvfb-run -a -s "-screen 0 1920x1080x24" /usr/bin/google-chrome-stable --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/root/AIOS/data/chrome_twin/default --no-first-run --no-default-browser-check --disable-infobars --disable-dev-shm-usage --renderer-process-limit=6 https://messages.google.com/web/conversations
Environment=DISPLAY=:1
Environment=XAUTHORITY=/root/.Xauthority

MemoryMax=3000M
CPUQuota=200%
