# Клиентские вопросы в WhatsApp → LLM-черновик ответа → задача need_confirm →
# Telegram-уведомление владельцу с текстом и командой одобрения (confirm <id>).
#
# ПОЛНЫЙ автономный цикл с человеческим гейтом: ничего не уходит клиенту
# без явного approve владельца (autonomy: draft).
id: whatsapp_client_llm_draft
title: "✉️ LLM-черновик ответа клиенту WhatsApp"
match:
  package: [com.whatsapp]
  text_regex: "(куп\\w+|цен\\w+|стоимост|доставк|ремонт|сервіс|услуг|скільки|сколько|заказ|наличи|гаранти)"
action:
  type: llm_enqueue
  prompt: "Ты — вежливый менеджер мастерской. Сообщение клиента: «{text}». Составь короткий (до 60 слов) деловой ответ на русском: поблагодари за обращение, ответь по сути или задай один уточняющий вопрос, предложи следующий шаг. Без эмодзи и официоза. Только текст ответа."
  job:
    kind: skill.run
    payload:
      skill: whatsapp_send_draft
      params:
        contact: "{title}"       # заголовок уведомления = имя отправителя
        text: "{draft}"          # LLM-черновик (без HTML-экранирования)
  notify: true
autonomy: draft                  # задача встанет need_confirm — отправка после approve
cooldown_seconds: 600            # не чаще раза в 10 минут по этому правилу
