name: Test Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  coverage:
    # Legacy/advisory job; the blocking surface is core-gate.yml.
    continue-on-error: true
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=aios_core \
            --cov-report=xml \
            --cov-report=term-missing \
            --ignore=test_real_android_app.py \
            --ignore=tests/test_android_rpa_bridge.py \
            -k "not real_device" \
            -q
        env:
          AIOS_FAST_TEST: "1"
          LLM_API_KEY: test_dummy_key
          OLX_WEBHOOK_SECRET: test_secret

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'**Line coverage: {rate:.1f}%**')
          print(f'| Metric | Value |')
          print(f'|--------|-------|')
          print(f'| Lines | {root.attrib.get(\"lines-valid\", \"N/A\")} |')
          print(f'| Covered | {root.attrib.get(\"lines-covered\", \"N/A\")} |')
          print(f'| Rate | {rate:.1f}% |')
          " >> $GITHUB_STEP_SUMMARY
