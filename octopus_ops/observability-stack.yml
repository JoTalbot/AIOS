version: "3.8"
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - /root/agents/-Octopus/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /root/agents/-Octopus/configs/prometheus/rules:/etc/prometheus/rules:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
