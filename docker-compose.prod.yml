# AIOS Production Stack — v9.3.1
# Services: API, MCP, Dashboard, Autopilot, Telegram Bot, Prometheus, Grafana
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml --profile bot up -d  # with Telegram
#
# Environment (.env or shell):
#   AIOS_API_KEYS, AIOS_TELEGRAM_TOKEN (optional), GRAFANA_PASSWORD

services:
  aios-api:
    build: .
    container_name: aios-api
    ports: ["127.0.0.1:8000:8000"]
    environment:
      AIOS_API_KEYS: ${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
      AIOS_API_AUTH_REQUIRED: ${AIOS_API_AUTH_REQUIRED:-0}
      AIOS_PROFILES_DB: /app/data/profiles.sqlite
      AIOS_DEVICES_DB: /app/data/devices.sqlite
      AIOS_SHARDS_DB: /app/data/shards.sqlite
      AIOS_OLX_DB: /app/data/olx.sqlite
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-3.5-sonnet}
      TELEGRAM_BOT_TOKEN: ${AIOS_TELEGRAM_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AIOS_TELEGRAM_TOKEN: ${AIOS_TELEGRAM_TOKEN:-}
      OLX_CLIENT_ID: ${OLX_CLIENT_ID:-}
      OLX_CLIENT_SECRET: ${OLX_CLIENT_SECRET:-}
      OLX_ACCESS_TOKEN: ${OLX_ACCESS_TOKEN:-}
      OLX_WEBHOOK_SECRET: ${OLX_WEBHOOK_SECRET:-}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      LOCAL_LLM: "1"
      LOCAL_LLM_BASE_URL: http://172.18.0.1:11434/v1/chat/completions
    volumes:
      - .:/app
      - aios-data:/app/data
      - aios-logs:/app/logs
      - /root/AIOS/data/olx_http.sqlite:/app/hostdata/olx_http.sqlite:ro  # v22: live OLX price intel (host collector data)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}
        reservations: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    networks: [aios-net]

  aios-mcp:
    build: .
    container_name: aios-mcp
    command: ["python", "run_mcp_server.py", "--host", "0.0.0.0", "--port", "8471", "--db", "/app/data/aios.sqlite"]
    ports: ["127.0.0.1:8471:8471"]
    environment:
      AIOS_API_KEYS: ${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
      AIOS_PROFILES_DB: /app/data/profiles.sqlite
      AIOS_DEVICES_DB: /app/data/devices.sqlite
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - aios-data:/app/data
      - aios-logs:/app/logs
      - /root/AIOS/data/olx_http.sqlite:/app/hostdata/olx_http.sqlite:ro  # v22: live OLX price intel (host collector data)
    depends_on:
      aios-api: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    networks: [aios-net]

  aios-dashboard:
    build: .
    container_name: aios-dashboard
    command: ["python", "run_dashboard_nicegui.py"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIOS_API_KEYS: ${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
      AIOS_API_KEY: ${AIOS_DASHBOARD_API_KEY:-}
      AIOS_DASH_PORT: "8080"
      AIOS_API_URL: http://aios-api:8000
      AIOS_PROFILES_DB: /app/data/profiles.sqlite
    volumes:
      - .:/app
      - aios-data:/app/data
    depends_on:
      aios-api: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [aios-net]

  aios-autopilot:
    build: .
    container_name: aios-autopilot
    command: ["python", "run_production_autopilot.py", "--daemon", "--interval", "900"]
    environment:
      AIOS_API_KEYS: ${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
      AIOS_PROFILES_DB: /app/data/profiles.sqlite
      AIOS_DEVICES_DB: /app/data/devices.sqlite
      AIOS_WEBHOOK_URL: ${AIOS_WEBHOOK_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${AIOS_TELEGRAM_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OLX_CLIENT_ID: ${OLX_CLIENT_ID:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - aios-data:/app/data
      - aios-logs:/app/logs
      - /root/AIOS/data/olx_http.sqlite:/app/hostdata/olx_http.sqlite:ro  # v22: live OLX price intel (host collector data)
    depends_on:
      aios-api: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "5"}
    networks: [aios-net]

  aios-telegram-bot:
    build: .
    container_name: aios-telegram-bot
    command: ["python", "run_telegram_bot.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${AIOS_TELEGRAM_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AIOS_TELEGRAM_TOKEN: ${AIOS_TELEGRAM_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      OLX_CLIENT_ID: ${OLX_CLIENT_ID:-}
      AIOS_DB_PATH: /app/data/aios.sqlite
      AIOS_PROFILES_DB: /app/data/profiles.sqlite
      AIOS_OLX_DB: /app/data/olx.sqlite
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - aios-data:/app/data
      - aios-logs:/app/logs
      - /root/AIOS/data/olx_http.sqlite:/app/hostdata/olx_http.sqlite:ro  # v22: live OLX price intel (host collector data)
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [aios-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: aios-prometheus
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/production-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "3"}
    networks: [aios-net]

  grafana:
    image: grafana/grafana:latest
    container_name: aios-grafana
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console
    volumes:
      - ./deploy/monitoring/grafana-production.json:/var/lib/grafana/dashboards/aios-production.json:ro
      - ./deploy/monitoring/grafana-autonomy.json:/var/lib/grafana/dashboards/aios-autonomy.json:ro
      - ./deploy/monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/aios.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    networks: [aios-net]


  alertmanager:
    image: prom/alertmanager:latest
    container_name: aios-alertmanager
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    networks: [aios-net]

  aios-exporter:
    image: python:3.11-slim
    container_name: aios-exporter
    volumes:
      - ./deploy/aios-exporter/server.py:/server.py:ro
      - aios-data:/data:ro
    command: ["python", "/server.py"]
    restart: unless-stopped
    networks: [aios-net]
volumes:
  aios-data:
  aios-logs:
  prometheus-data:
  grafana-data:

networks:
  aios-net:
    driver: bridge
