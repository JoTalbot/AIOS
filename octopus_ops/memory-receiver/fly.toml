# Подготовленный конфиг для Fly.io memory receiver.
# Не деплоится автоматически: Fly.io не имеет постоянного free tier,
# поэтому перед запуском нужна явная команда пользователя.
app = "octopus-memory-0529080740"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  OCTOPUS_MEMORY_POOL = "/data/memory_pool"
  OCTOPUS_REPLICATION_NONCE_DIR = "/data/nonces"
  OCTOPUS_MEMORY_INDEX = "/data/index.jsonl"
  OCTOPUS_REPLICATION_MAX_SKEW_SECONDS = "300"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Для реального memory-узла нужен volume, иначе данные будут эфемерными.
[[mounts]]
  source = "octopus_memory_data"
  destination = "/data"
