name: Hetzner Server Inventory

# Ручной одноразовый аудит. Данные серверов не выводятся в публичные логи:
# JSON шифруется перед загрузкой в GitHub Actions artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Получить зашифрованный список серверов
    runs-on: ubuntu-latest
    steps:
      - name: Проверить необходимые секреты
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          INVENTORY_KEY: ${{ secrets.HETZNER_INVENTORY_KEY }}
        run: |
          if [ -z "$HETZNER_API" ]; then
            echo "Секрет HERTZNER_API не настроен." >&2
            exit 1
          fi
          if [ -z "$INVENTORY_KEY" ]; then
            echo "Временный секрет HETZNER_INVENTORY_KEY не настроен." >&2
            exit 1
          fi

      - name: Запросить серверы Hetzner Cloud
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["HETZNER_API"]
          servers = []
          page = 1

          while True:
              query = urllib.parse.urlencode({"page": page, "per_page": 50})
              request = urllib.request.Request(
                  f"https://api.hetzner.cloud/v1/servers?{query}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "AIOS-Hetzner-Inventory/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              batch = payload.get("servers", [])
              servers.extend(batch)
              pagination = payload.get("meta", {}).get("pagination", {})
              next_page = pagination.get("next_page")
              if not next_page:
                  break
              page = int(next_page)

          def compact(server):
              server_type = server.get("server_type") or {}
              datacenter = server.get("datacenter") or {}
              location = datacenter.get("location") or {}
              image = server.get("image") or {}
              public_net = server.get("public_net") or {}
              ipv4 = public_net.get("ipv4") or {}
              ipv6 = public_net.get("ipv6") or {}
              return {
                  "id": server.get("id"),
                  "name": server.get("name"),
                  "status": server.get("status"),
                  "locked": server.get("locked"),
                  "created": server.get("created"),
                  "server_type": {
                      "name": server_type.get("name"),
                      "description": server_type.get("description"),
                      "cores": server_type.get("cores"),
                      "memory_gb": server_type.get("memory"),
                      "disk_gb": server_type.get("disk"),
                      "cpu_type": server_type.get("cpu_type"),
                  },
                  "datacenter": datacenter.get("name"),
                  "location": {
                      "name": location.get("name"),
                      "city": location.get("city"),
                      "country": location.get("country"),
                  },
                  "image": {
                      "name": image.get("name"),
                      "description": image.get("description"),
                      "os_flavor": image.get("os_flavor"),
                      "os_version": image.get("os_version"),
                  },
                  "ipv4": ipv4.get("ip"),
                  "ipv6": ipv6.get("ip"),
                  "private_networks": [
                      {"network": item.get("network"), "ip": item.get("ip")}
                      for item in (server.get("private_net") or [])
                  ],
                  "labels": server.get("labels") or {},
                  "protection": server.get("protection") or {},
                  "backup_window": server.get("backup_window"),
                  "rescue_enabled": server.get("rescue_enabled"),
              }

          inventory = {
              "generated_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "count": len(servers),
              "servers": [compact(server) for server in servers],
          }
          output = Path("/tmp/hetzner-inventory.json")
          output.write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Получено серверов: {len(servers)}")
          PY

      - name: Зашифровать инвентаризацию
        env:
          INVENTORY_KEY: ${{ secrets.HETZNER_INVENTORY_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/hetzner-inventory.json \
            -out /tmp/hetzner-inventory.enc \
            -pass env:INVENTORY_KEY
          rm -f /tmp/hetzner-inventory.json

      - name: Загрузить зашифрованный artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hetzner-inventory-encrypted
          path: /tmp/hetzner-inventory.enc
          if-no-files-found: error
          retention-days: 1
