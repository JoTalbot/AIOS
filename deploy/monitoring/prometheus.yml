# Prometheus scrape config для AIOS ops-metrics.
#
#   docker run --rm --network host \
#     -v "$PWD/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml" \
#     prom/prometheus:v2.53.0
#
# AIOS REST-агент должен слушать порт 8000 (make serve / uvicorn).
global:
  scrape_interval: 15s
  evaluation_interval: 15s


alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "aios-alerts.yml"
  - "production-alerts.yml"

scrape_configs:
  - job_name: aios
    metrics_path: /metrics
    static_configs:
      - targets:
          - "aios-api:8000"
        labels:
          service: aios-rest

  - job_name: aios-phone
    metrics_path: /metrics
    static_configs:
      - targets: ["172.18.0.1:9102"]
        labels:
          service: aios-phone

  - job_name: aios-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["aios-exporter:9101"]
        labels:
          service: aios-exporter

  - job_name: aios-telegram
    metrics_path: /metrics
    static_configs:
      - targets: ["aios-telegram-exporter:9103"]
        labels:
          service: telegram-llm
