name: Deploy pinned production Compose to VPS

# Manual only: production mutation requires an explicit operator action. The
# canonical stack is the root docker-compose.prod.yml with its pinned image.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps-production-compose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verify required secrets exist
        id: check
        env:
          SEC_VPS_HOST: ${{ secrets.VPS_HOST }}
          SEC_VPS_PORT: ${{ secrets.VPS_PORT }}
          SEC_VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          SEC_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SEC_VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          SEC_ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        run: |
          missing=""
          for var in SEC_VPS_HOST SEC_VPS_PORT SEC_VPS_USERNAME SEC_VPS_SSH_KEY SEC_VPS_APP_DIR SEC_ENV_FILE_CONTENTS; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "Deploy secrets not configured:$missing — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Apply canonical production Compose
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fast-forward main and apply pinned stack
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,ENV_FILE_CONTENTS
          script: |
            set -eu
            cd "$VPS_APP_DIR"
            git fetch origin main
            git merge --ff-only origin/main
            printf '%s\n' "$ENV_FILE_CONTENTS" > .env
            chmod 600 .env
            docker compose -f docker-compose.prod.yml config -q
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            echo "Canonical production Compose applied successfully."
