# iMe Messenger: открыть чат, вставить текст, нажать отправить.
# params: contact, text. Фактическая отправка — confirm обязателен.
id: ime_send_draft
title: "iMe: отправить сообщение"
app: ime
params: [contact, text]
confirm: true
sensitive: false
steps:
  - id: open_app
    do: app.open
    package: com.iMe.android
    fresh: true            # холодный старт: не продолжать открытую сессию

  - id: dismiss_promo
    do: ui.key
    keycode: KEYCODE_BACK   # закрыть промо-шаттер «Подарить Premium» после старта
    optional: true

  - id: open_search
    do: ui.tap
    timeout: 8
    heal: true
    heal_hint: "the search bar or search icon at the top of the iMe chats list"
    selectors:
      - {resource: "com.iMe.android:id/menu_search"}
      - {desc_contains: "Поиск чатов"}
      - {desc_contains: "Поиск"}

  - id: type_contact
    do: ui.type
    text: "${contact}"

  - id: open_result
    do: ui.tap
    timeout: 14
    heal: true
    heal_hint: "the chat search result row titled ${contact}"
    selectors:
      - {text: "${contact}"}
      - {text_contains: "${contact}"}

  - id: focus_input
    do: ui.tap
    timeout: 8
    heal: true
    heal_hint: "the message input field at the bottom of the chat"
    selectors:
      - {desc_contains: "Сообщение"}
      - {desc_contains: "Повідомлення"}
      - {text_contains: "Сообщение"}

  - id: type_message
    do: ui.type
    text: "${text}"

  - id: tap_send
    do: ui.tap
    timeout: 5
    heal: true
    heal_hint: "the round send button at the bottom right of the message input row in iMe"
    selectors:
      - {desc_contains: "Отправить"}
      - {desc_contains: "Send"}
      - {resource: "com.iMe.android:id/send"}
