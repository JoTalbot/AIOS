apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aios
  template:
    metadata:
      labels:
        app: aios
    spec:
      containers:
        - name: aios
          image: jotalbot/aios:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080