# WhatsApp: открыть чат с контактом (без отправки сообщений).
# params: contact — имя контакта как в телефонной книге.
id: whatsapp_open_chat
title: "WhatsApp: открыть чат"
app: whatsapp
params: [contact]
confirm: true
sensitive: false
steps:
  - id: open_app
    do: app.open
    package: com.whatsapp

  - id: wait_home
    do: ui.wait
    timeout: 8
    selectors:
      - {resource: "com.whatsapp:id/conversations_row"}
      - {text: "Чаты"}
      - {text: "Chats"}

  - id: open_search
    do: ui.tap
    timeout: 5
    heal: true
    heal_hint: "the search icon (magnifying glass) in the top app bar of the WhatsApp chats screen"
    selectors:
      - {resource: "com.whatsapp:id/menuitem_search"}
      - {desc_contains: "Поиск"}
      - {desc_contains: "Search"}

  - id: type_contact
    do: ui.type
    text: "${contact}"

  - id: open_result
    do: ui.tap
    timeout: 7
    heal: true
    heal_hint: "the chat search result row titled ${contact}"
    selectors:
      - {text: "${contact}"}
      - {text_contains: "${contact}"}
