name: Create Clean Hetzner Server

# Ручное создание чистого сервера по аппаратному профилю существующего узла.
# Никакие данные, приложения, firewall или private networks не копируются.
on:
  workflow_dispatch:
    inputs:
      source_name:
        description: "Сервер-образец для типа, ОС и локации"
        required: true
        default: "autosklo-prod"
        type: string
      new_name:
        description: "Имя нового чистого сервера"
        required: true
        default: "aios"
        type: string
      confirmation:
        description: "Для подтверждения создания введите CREATE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hetzner-create-server
  cancel-in-progress: false

jobs:
  create:
    name: Создать чистый сервер Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение и секреты
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          RESULT_KEY: ${{ secrets.HETZNER_RESULT_KEY }}
        run: |
          if [ "$CONFIRMATION" != "CREATE" ]; then
            echo "Создание не подтверждено: требуется значение CREATE." >&2
            exit 1
          fi
          if [ -z "$HETZNER_API" ]; then
            echo "Секрет HERTZNER_API не настроен." >&2
            exit 1
          fi
          if [ -z "$RESULT_KEY" ]; then
            echo "Временный секрет HETZNER_RESULT_KEY не настроен." >&2
            exit 1
          fi

      - name: Создать сервер через Hetzner Cloud API
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          SOURCE_NAME: ${{ inputs.source_name }}
          NEW_NAME: ${{ inputs.new_name }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["HETZNER_API"]
          source_name = os.environ["SOURCE_NAME"].strip()
          new_name = os.environ["NEW_NAME"].strip()
          api_base = "https://api.hetzner.cloud/v1"

          hostname_pattern = re.compile(
              r"^(?=.{1,63}$)[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$"
          )
          if not hostname_pattern.fullmatch(source_name):
              raise SystemExit("Некорректное имя исходного сервера.")
          if not hostname_pattern.fullmatch(new_name):
              raise SystemExit("Некорректное имя нового сервера.")
          if source_name == new_name:
              raise SystemExit("Новое имя должно отличаться от исходного.")

          def api_request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-Provisioner/1.0",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{api_base}{path}", data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Hetzner API вернул HTTP {error.code}: {detail}"
                  ) from error

          def list_all(path, collection_name):
              items = []
              page = 1
              separator = "&" if "?" in path else "?"
              while True:
                  payload = api_request(
                      "GET", f"{path}{separator}page={page}&per_page=50"
                  )
                  items.extend(payload.get(collection_name, []))
                  next_page = (
                      payload.get("meta", {})
                      .get("pagination", {})
                      .get("next_page")
                  )
                  if not next_page:
                      return items
                  page = int(next_page)

          source_query = urllib.parse.quote(source_name, safe="")
          source_matches = api_request(
              "GET", f"/servers?name={source_query}&per_page=50"
          ).get("servers", [])
          source_servers = [
              server for server in source_matches if server.get("name") == source_name
          ]
          if len(source_servers) != 1:
              raise SystemExit(
                  f"Ожидался один сервер {source_name!r}, найдено: "
                  f"{len(source_servers)}."
              )
          source = source_servers[0]

          new_query = urllib.parse.quote(new_name, safe="")
          existing = api_request(
              "GET", f"/servers?name={new_query}&per_page=50"
          ).get("servers", [])
          if any(server.get("name") == new_name for server in existing):
              raise SystemExit(
                  f"Сервер {new_name!r} уже существует; повторное создание отменено."
              )

          server_type = (source.get("server_type") or {}).get("name")
          image = (source.get("image") or {}).get("name")
          location = (source.get("location") or {}).get("name")
          if not server_type or not image or not location:
              raise SystemExit(
                  "Hetzner API не вернул server_type, image или location образца."
              )

          ssh_keys = list_all("/ssh_keys", "ssh_keys")
          if not ssh_keys:
              raise SystemExit(
                  "В проекте Hetzner нет SSH-ключей; создание отменено, чтобы "
                  "не потерять доступ к серверу."
              )

          create_payload = {
              "name": new_name,
              "server_type": server_type,
              "image": image,
              "location": location,
              "ssh_keys": [key["id"] for key in ssh_keys],
              "start_after_create": True,
              "public_net": {"enable_ipv4": True, "enable_ipv6": True},
              "automount": False,
              "user_data": "",
          }
          created = api_request("POST", "/servers", create_payload)
          server = created["server"]
          action = created.get("action") or {}
          action_id = action.get("id")

          if action_id:
              deadline = time.monotonic() + 300
              while time.monotonic() < deadline:
                  action_payload = api_request("GET", f"/actions/{action_id}")
                  action_state = (action_payload.get("action") or {}).get("status")
                  if action_state == "success":
                      break
                  if action_state == "error":
                      errors = (action_payload.get("action") or {}).get("error")
                      raise RuntimeError(f"Создание сервера завершилось ошибкой: {errors}")
                  time.sleep(3)
              else:
                  raise TimeoutError("Создание сервера не завершилось за 5 минут.")

          server_id = server["id"]
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              server = api_request("GET", f"/servers/{server_id}")["server"]
              if server.get("status") == "running":
                  break
              time.sleep(3)

          server_type_info = server.get("server_type") or {}
          image_info = server.get("image") or {}
          location_info = server.get("location") or {}
          public_net = server.get("public_net") or {}
          ipv4 = public_net.get("ipv4") or {}
          ipv6 = public_net.get("ipv6") or {}

          result = {
              "generated_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "source_server": source_name,
              "server": {
                  "id": server.get("id"),
                  "name": server.get("name"),
                  "status": server.get("status"),
                  "created": server.get("created"),
                  "server_type": {
                      "name": server_type_info.get("name"),
                      "description": server_type_info.get("description"),
                      "cores": server_type_info.get("cores"),
                      "memory_gb": server_type_info.get("memory"),
                      "disk_gb": server_type_info.get("disk"),
                      "cpu_type": server_type_info.get("cpu_type"),
                  },
                  "location": {
                      "name": location_info.get("name"),
                      "city": location_info.get("city"),
                      "country": location_info.get("country"),
                  },
                  "image": {
                      "name": image_info.get("name"),
                      "description": image_info.get("description"),
                      "os_flavor": image_info.get("os_flavor"),
                      "os_version": image_info.get("os_version"),
                  },
                  "ipv4": ipv4.get("ip"),
                  "ipv6": ipv6.get("ip"),
                  "ssh_keys": [
                      {"id": key.get("id"), "name": key.get("name")}
                      for key in ssh_keys
                  ],
                  "backups_enabled": server.get("backup_window") is not None,
                  "private_networks": server.get("private_net") or [],
              },
          }
          Path("/tmp/hetzner-create-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("Сервер создан и перешёл в состояние running.")
          PY

      - name: Зашифровать результат
        if: success()
        env:
          RESULT_KEY: ${{ secrets.HETZNER_RESULT_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/hetzner-create-result.json \
            -out /tmp/hetzner-create-result.enc \
            -pass env:RESULT_KEY
          rm -f /tmp/hetzner-create-result.json

      - name: Загрузить зашифрованный результат
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hetzner-create-result-encrypted
          path: /tmp/hetzner-create-result.enc
          if-no-files-found: error
          retention-days: 1
