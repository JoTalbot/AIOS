<!DOCTYPE html>
<html>
<head>
    <title>AIOS Dashboard v4.1</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #0f172a; color: #e2e8f0; }
        .card { background: #1e2937; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        h1 { color: #60a5fa; }
        .stat { display: inline-block; margin: 10px 20px; }
        .label { color: #94a3b8; font-size: 0.9rem; }
        .value { font-size: 1.8rem; font-weight: 600; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin: 5px; }
        button:hover { background: #2563eb; }
        a { color: #60a5fa; }
        .version-switch { position: fixed; top: 10px; right: 10px; z-index: 9999; }
        .version-switch a { background: rgba(96,165,250,0.2); color: #e2e8f0; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
        .olx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 12px; margin-top: 10px; }
        .olx-card { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
        .olx-card .price { color: #28a745; font-weight: bold; }
        .olx-card a { color: #e2e8f0; text-decoration: none; }
        .olx-card a:hover { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="version-switch">
        <a href="?v=react">⚛️ React (web_ui)</a> &nbsp;|&nbsp; <a href="?v=adminlte">🔀 AdminLTE</a> &nbsp;|&nbsp; <b>v4.1 simple</b>
    </div>
    <h1>🚀 AIOS Dashboard v4.1</h1>
    <p>Version: <span id="ver">...</span></p>

    <div class="card">
        <h2>📊 System Stats</h2>
        <div id="stats"></div>
    </div>

    <div class="card">
        <h2>🧠 Subsystems</h2>
        <div id="subsystems"></div>
    </div>

    <div class="card">
        <h2>🛒 OLX Parser Agent</h2>
        <div id="olx"></div>
        <div class="olx-grid" id="olx_latest"></div>
    </div>

    <div class="card">
        <h2>⚡ Quick Actions</h2>
        <button onclick="location.reload()">Refresh</button>
        <button onclick="runHealthCheck()">Health Check</button>
        <button onclick="createDemoTask()">Create Demo Task</button>
    </div>

    <script>
        const API = "api/";
        async function jget(p){ const r=await fetch(API+p,{cache:"no-store"}); if(!r.ok) throw new Error(p+" -> "+r.status); return r.json(); }
        async function refresh() {
            try {
                const stats = await jget("stats");
                document.getElementById("ver").textContent = stats.version || "?";
                document.getElementById("stats").innerHTML =
                    '<div class="stat"><div class="label">Tasks</div><div class="value">'+(stats.total_tasks||0)+'</div></div>'+
                    '<div class="stat"><div class="label">Active</div><div class="value">'+(stats.active_tasks||0)+'</div></div>'+
                    '<div class="stat"><div class="label">Memory</div><div class="value">'+(stats.memory_items||0)+'</div></div>'+
                    '<div class="stat"><div class="label">Federation</div><div class="value">'+(stats.subsystems&&stats.subsystems.federation?stats.subsystems.federation.total_nodes||0:0)+'</div></div>';
                const sub = document.getElementById("subsystems");
                const subs = stats.subsystems || {};
                sub.innerHTML = Object.keys(subs).map(k =>
                    '<div class="stat"><div class="label">'+k+'</div><div class="value">'+(subs[k].total_profiles || subs[k].total_capabilities || subs[k].total_nodes || "OK")+'</div></div>'
                ).join("");
            } catch(e) { console.error(e); }
            try {
                const olx = await jget("olx");
                const box = document.getElementById("olx");
                if (!olx.available) {
                    box.innerHTML = '<div class="label">OLX db not configured</div>';
                    document.getElementById("olx_latest").innerHTML = "";
                } else {
                    box.innerHTML =
                        '<div class="stat"><div class="label">Tracked ads</div><div class="value">'+(olx.ads_total||0)+'</div></div>'+
                        '<div class="stat"><div class="label">Active</div><div class="value">'+(olx.ads_active||0)+'</div></div>'+
                        '<div class="stat"><div class="label">New 24h</div><div class="value">'+(olx.new_24h||0)+'</div></div>'+
                        '<div class="stat"><div class="label">Avg price</div><div class="value">'+(olx.price_avg?Math.round(olx.price_avg).toLocaleString()+" грн":"—")+'</div></div>';
                    const list = await fetch(API+"olx/list?sort=new&limit=8").then(r=>r.json());
                    document.getElementById("olx_latest").innerHTML = (list.ads||[]).map(a=>
                        '<div class="olx-card">'+
                        '<a href="'+(a.url||"#")+'" target="_blank"><b>'+((a.title||"").substring(0,70))+'</b></a><br>'+
                        '<span class="price">'+(a.price_value?Math.round(a.price_value).toLocaleString()+" "+(a.price_currency||"грн"):"Договірна")+'</span><br>'+
                        '<small>📍 '+(a.city||"?")+' · '+(a.query||"")+'</small></div>'
                    ).join("");
                }
            } catch(e) { console.error(e); }
        }
        async function runHealthCheck() {
            const j = await jget("health");
            alert("Health: " + j.status+" v"+j.version);
        }
        async function createDemoTask() {
            try {
                const r = await fetch(API+"v1/tasks", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name: "Dashboard Demo v4.1", description:"Created from UI"})});
                const j = await r.json();
                if(j.task_id) { alert("Task created! id="+j.task_id); refresh(); }
                else alert(JSON.stringify(j));
            } catch(e) { alert("Failed (needs Bearer key): "+e.message); }
        }
        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
