services:
  aios-api:
    image: aios:9.1.0
    container_name: aios-api-prod
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AIOS_API_KEYS=${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
      - AIOS_PROFILES_DB=/app/data/profiles.sqlite
      - AIOS_DEVICES_DB=/app/data/devices.sqlite
      - AIOS_SHARDS_DB=/app/data/shards.sqlite
      - AIOS_OLX_DB=/app/data/olx.sqlite
      - AIOS_PRODUCTION_PROFILES=instagram:ig_shop_1,instagram:ig_shop_2,instagram:ig_shop_3
      - AIOS_DEVICE_POOL_SIZE=3
      - AIOS_CYCLE_INTERVAL=900
      - AIOS_WEBHOOK_URL=${AIOS_WEBHOOK_URL:-}
      - PYTHONUNBUFFERED=1
      - AIOS_HOST_ID=shard-prod-1
    volumes:
      - ../../data:/app/data
      - ../../logs:/app/logs
      - aios-prod-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aios-prod-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  aios-autopilot:
    image: aios:9.1.0
    container_name: aios-autopilot-prod
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "run_production_autopilot.py", "--config", "default_3_ig", "--cycles-per-day", "24", "--daemon", "--interval", "900"]
    environment:
      - AIOS_API_KEYS=${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
      - AIOS_PROFILES_DB=/app/data/profiles.sqlite
      - AIOS_DEVICES_DB=/app/data/devices.sqlite
      - AIOS_SHARDS_DB=/app/data/shards.sqlite
      - AIOS_WEBHOOK_URL=${AIOS_WEBHOOK_URL:-}
      - PYTHONUNBUFFERED=1
      - AIOS_HOST_ID=autopilot-prod-1
    volumes:
      - ../../data:/app/data
      - ../../logs:/app/logs
    depends_on:
      aios-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aios-prod-net

  aios-dashboard:
    image: aios:9.1.0
    container_name: aios-dashboard-prod
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "run_dashboard.py"]
    ports:
      - "8080:8080"
    environment:
      - AIOS_API_KEYS=${AIOS_API_KEYS:?Set AIOS_API_KEYS in .env}
    depends_on:
      aios-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aios-prod-net

  aios-telegram-exporter:
    image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    container_name: aios-telegram-exporter-prod
    command: ["python", "-u", "/server.py"]
    environment:
      TELEGRAM_PROMETHEUS_HOST: "0.0.0.0"
      TELEGRAM_PROMETHEUS_PORT: "9103"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../monitoring/telegram_exporter_server.py:/server.py:ro
      - /var/lib/aios-telegram-metrics:/metrics:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - aios-prod-net

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: aios-prometheus-prod
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../monitoring/aios-alerts.yml:/etc/prometheus/aios-alerts.yml
      - ../monitoring/production-alerts.yml:/etc/prometheus/production-alerts.yml
      - prometheus-prod-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - aios-prod-net

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: aios-grafana-prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/aios.yml:ro
      - ../monitoring/grafana-aios-ops.json:/var/lib/grafana/dashboards/aios-ops.json:ro
      - ../monitoring/grafana-production.json:/var/lib/grafana/dashboards/production.json:ro
      - ../monitoring/grafana-telegram-llm.json:/var/lib/grafana/dashboards/telegram-llm.json:ro
      - grafana-prod-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - aios-prod-net

  aios-alert-canary-receiver:
    image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    container_name: aios-alert-canary-receiver-prod
    command: ["python", "-u", "/receiver.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../monitoring/alertmanager_canary_receiver.py:/receiver.py:ro
      - /etc/aios/credentials/telegram_token:/run/secrets/telegram_token:ro
      - /etc/aios/credentials/telegram_owner_chat_id:/run/secrets/telegram_owner_chat_id:ro
      - /var/lib/aios-alert-canary:/state
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - aios-prod-net

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    container_name: aios-alertmanager-prod
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - /etc/aios/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /etc/aios/credentials/telegram_token:/run/secrets/telegram_token:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /alertmanager:rw,noexec,nosuid,nodev,size=32m
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      - aios-alert-canary-receiver
    restart: unless-stopped
    networks:
      - aios-prod-net

volumes:
  aios-prod-data:
  prometheus-prod-data:
  grafana-prod-data:

networks:
  aios-prod-net:
    driver: bridge
