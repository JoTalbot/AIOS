name: AIOS SSH Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      remote_dir:
        description: 'Remote installation path'
        required: false
        default: '/opt/aios'
      force_rebuild:
        description: 'Force Docker rebuild without cache'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check SSH Secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      host: ${{ steps.check.outputs.host }}
      user: ${{ steps.check.outputs.user }}
      port: ${{ steps.check.outputs.port }}
      app_dir: ${{ steps.check.outputs.app_dir }}
    steps:
      - name: Verify SSH secrets exist
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.VPS_USERNAME || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.VPS_PORT || '22' }}
          SSH_PATH: ${{ secrets.SSH_PATH || secrets.VPS_APP_DIR || '/opt/aios' }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::SSH deploy secrets (SSH_HOST, SSH_KEY) are not configured in GitHub Secrets. SSH deployment skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"
            echo "user=$SSH_USER" >> "$GITHUB_OUTPUT"
            echo "port=$SSH_PORT" >> "$GITHUB_OUTPUT"
            echo "app_dir=$SSH_PATH" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to SSH Target Server
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          known_hosts: 'placeholder'
          config: |
            Host target-server
              HostName ${{ needs.check-secrets.outputs.host }}
              User ${{ needs.check-secrets.outputs.user }}
              Port ${{ needs.check-secrets.outputs.port }}
              StrictHostKeyChecking no

      - name: Deploy codebase and start stack via SSH
        env:
          APP_DIR: ${{ github.event.inputs.remote_dir || needs.check-secrets.outputs.app_dir }}
          ENV_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          ssh target-server << EOF
            set -euo pipefail

            echo "🚀 [1/5] Synchronizing repository in ${APP_DIR}..."
            mkdir -p "${APP_DIR}"
            if [ -d "${APP_DIR}/.git" ]; then
              cd "${APP_DIR}"
              git fetch origin
              git checkout ${{ github.sha }} || git checkout main
              git reset --hard origin/main
            else
              git clone https://github.com/JoTalbot/AIOS.git "${APP_DIR}"
              cd "${APP_DIR}"
              git checkout ${{ github.sha }} || git checkout main
            fi

            echo "⚙️ [2/5] Configuring .env environment..."
            if [ -n "${ENV_CONTENTS:-}" ]; then
              echo "${ENV_CONTENTS}" > .env
            elif [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
              fi
              API_KEY=\$(python3 -c "import secrets; print(secrets.token_urlsafe(32))" 2>/dev/null || openssl rand -hex 24)
              GRAFANA_PASS=\$(python3 -c "import secrets; print(secrets.token_urlsafe(16))" 2>/dev/null || openssl rand -hex 12)
              echo "AIOS_API_KEYS={\"\\\$API_KEY\":{\"subject\":\"ci-deploy\",\"roles\":[\"admin\"]}}" >> .env
              echo "GRAFANA_PASSWORD=\$GRAFANA_PASS" >> .env
            fi

            echo "🐳 [3/5] Starting Docker Compose stack..."
            BUILD_FLAGS=""
            if [ "${FORCE_REBUILD}" = "true" ]; then
              BUILD_FLAGS="--no-cache"
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
              docker compose -f docker-compose.prod.yml up -d --build \$BUILD_FLAGS
            else
              docker-compose -f docker-compose.prod.yml down --remove-orphans || true
              docker-compose -f docker-compose.prod.yml up -d --build \$BUILD_FLAGS
            fi

            echo "🩺 [4/5] Checking container status & health..."
            sleep 10
            curl -f http://localhost:8000/health || exit 1

            echo "✅ Deployment completed successfully!"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.prod.yml ps
            else
              docker-compose -f docker-compose.prod.yml ps
            fi
          EOF

      - name: Verify Health Endpoint remotely
        run: |
          ssh target-server "curl -s http://localhost:8000/health | jq ." || echo "Healthcheck completed"
