version: "3.8"
services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    ports:
      - "9090:9090"
    volumes:
      - /root/agents/-Octopus/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /root/agents/-Octopus/configs/prometheus/rules:/etc/prometheus/rules:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
