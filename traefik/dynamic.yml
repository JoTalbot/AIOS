http:
  middlewares:
    api-rate-limit:
      rateLimit:
        average: 50
        period: 1m
    webhook-rate-limit:
      rateLimit:
        average: 200
        period: 1m

  routers:
    aios-api:
      rule: "Host(`aios.local`) && PathPrefix(`/api`)"
      service: aios-core
      middlewares:
        - api-rate-limit
      entryPoints:
        - websecure

    aios-webhooks:
      rule: "Host(`aios.local`) && PathPrefix(`/webhooks`)"
      service: aios-core
      middlewares:
        - webhook-rate-limit
      entryPoints:
        - websecure

    aios-dashboard:
      rule: "Host(`aios.local`)"
      service: aios-core
      entryPoints:
        - websecure

  services:
    aios-core:
      loadBalancer:
        servers:
          - url: "http://aios-core:8080"
