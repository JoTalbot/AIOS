version: '3.8'

services:
  # AIOS Главное Ядро и API
  aios_backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - CONSTITUTION_MODE=STRICT

  # Фронтенд: Arena Router Chat (Из Octopus)
  aios_frontend:
    build: 
      context: ./octopus_services/arena-router-chat
    ports:
      - "3000:3000"
    depends_on:
      - aios_backend

  # Обсервабилити: Prometheus (Метрики Роя)
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    volumes:
      - ./octopus_obs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Обсервабилити: Grafana (Дашборды)
  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
