name: Configure Cloudflare Access for AIOS

on:
  workflow_dispatch:
    inputs:
      allowed_email:
        description: E-mail allowed to access the AIOS dashboard
        required: true
        default: jo.talbot@gmail.com
        type: string

permissions:
  contents: read

jobs:
  protect-dashboard:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: api.autosklo.org.ua
      ALLOWED_EMAIL: ${{ inputs.allowed_email }}
    steps:
      - name: Validate secrets
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_DNS_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Create or update self-hosted Access application
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps"
          headers=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          apps=$(curl --fail-with-body -sS "${headers[@]}" "${base}?domain=${DOMAIN}")
          app_id=$(jq -r '.result[0].id // empty' <<<"$apps")
          app_payload=$(jq -nc --arg name "AIOS Dashboard" --arg domain "$DOMAIN" '{name:$name,domain:$domain,type:"self_hosted",session_duration:"24h",auto_redirect_to_identity:false,app_launcher_visible:false}')
          if [[ -n "$app_id" ]]; then
            curl --fail-with-body -sS -X PUT "${headers[@]}" --data "$app_payload" "${base}/${app_id}" >/dev/null
          else
            created=$(curl --fail-with-body -sS -X POST "${headers[@]}" --data "$app_payload" "$base")
            app_id=$(jq -r '.result.id' <<<"$created")
          fi

          policy_base="${base}/${app_id}/policies"
          policies=$(curl --fail-with-body -sS "${headers[@]}" "$policy_base")
          policy_id=$(jq -r '.result[] | select(.name == "Allow dashboard owner") | .id' <<<"$policies" | head -1)
          policy_payload=$(jq -nc --arg email "$ALLOWED_EMAIL" '{name:"Allow dashboard owner",decision:"allow",precedence:1,include:[{email:{email:$email}}],exclude:[],require:[]}')
          if [[ -n "$policy_id" ]]; then
            curl --fail-with-body -sS -X PUT "${headers[@]}" --data "$policy_payload" "${policy_base}/${policy_id}" >/dev/null
          else
            curl --fail-with-body -sS -X POST "${headers[@]}" --data "$policy_payload" "$policy_base" >/dev/null
          fi
          echo "Cloudflare Access configured for ${DOMAIN} and ${ALLOWED_EMAIL}"
