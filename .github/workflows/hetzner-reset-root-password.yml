name: Reset Hetzner Root Password

# Ручной сброс root-пароля. Пароль никогда не выводится в публичные логи:
# результат шифруется до загрузки в GitHub Actions artifact.
on:
  workflow_dispatch:
    inputs:
      server_name:
        description: "Имя сервера Hetzner"
        required: true
        default: "aios"
        type: string
      confirmation:
        description: "Для подтверждения введите RESET"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hetzner-reset-root-password
  cancel-in-progress: false

jobs:
  reset-password:
    name: Сбросить root-пароль
    runs-on: ubuntu-latest
    steps:
      - name: Проверить подтверждение и секреты
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          RESULT_KEY: ${{ secrets.HETZNER_RESULT_KEY }}
        run: |
          if [ "$CONFIRMATION" != "RESET" ]; then
            echo "Сброс не подтверждён: требуется значение RESET." >&2
            exit 1
          fi
          if [ -z "$HETZNER_API" ]; then
            echo "Секрет HERTZNER_API не настроен." >&2
            exit 1
          fi
          if [ -z "$RESULT_KEY" ]; then
            echo "Временный секрет HETZNER_RESULT_KEY не настроен." >&2
            exit 1
          fi

      - name: Сбросить пароль через Hetzner Cloud API
        env:
          HETZNER_API: ${{ secrets.HERTZNER_API }}
          SERVER_NAME: ${{ inputs.server_name }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["HETZNER_API"]
          server_name = os.environ["SERVER_NAME"].strip()
          api_base = "https://api.hetzner.cloud/v1"

          hostname_pattern = re.compile(
              r"^(?=.{1,63}$)[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$"
          )
          if not hostname_pattern.fullmatch(server_name):
              raise SystemExit("Некорректное имя сервера.")

          def api_request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "AIOS-Hetzner-Password-Reset/1.0",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  f"{api_base}{path}", data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Hetzner API вернул HTTP {error.code}: {detail}"
                  ) from error

          query = urllib.parse.quote(server_name, safe="")
          matches = api_request(
              "GET", f"/servers?name={query}&per_page=50"
          ).get("servers", [])
          servers = [server for server in matches if server.get("name") == server_name]
          if len(servers) != 1:
              raise SystemExit(
                  f"Ожидался один сервер {server_name!r}, найдено: {len(servers)}."
              )

          server = servers[0]
          response = api_request(
              "POST", f"/servers/{server['id']}/actions/reset_password", {}
          )
          root_password = response.get("root_password")
          if not root_password:
              raise RuntimeError("Hetzner API не вернул новый root-пароль.")

          action = response.get("action") or {}
          action_id = action.get("id")
          if action_id:
              deadline = time.monotonic() + 180
              while time.monotonic() < deadline:
                  action_payload = api_request("GET", f"/actions/{action_id}")
                  action_data = action_payload.get("action") or {}
                  action_status = action_data.get("status")
                  if action_status == "success":
                      break
                  if action_status == "error":
                      raise RuntimeError(
                          f"Сброс пароля завершился ошибкой: {action_data.get('error')}"
                      )
                  time.sleep(2)
              else:
                  raise TimeoutError("Сброс пароля не завершился за 3 минуты.")

          public_net = server.get("public_net") or {}
          ipv4 = (public_net.get("ipv4") or {}).get("ip")
          result = {
              "generated_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "server": {
                  "id": server.get("id"),
                  "name": server.get("name"),
                  "ipv4": ipv4,
              },
              "username": "root",
              "root_password": root_password,
          }
          Path("/tmp/hetzner-password-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("Root-пароль успешно сброшен; результат подготовлен к шифрованию.")
          PY

      - name: Зашифровать результат
        if: success()
        env:
          RESULT_KEY: ${{ secrets.HETZNER_RESULT_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/hetzner-password-result.json \
            -out /tmp/hetzner-password-result.enc \
            -pass env:RESULT_KEY
          rm -f /tmp/hetzner-password-result.json

      - name: Загрузить зашифрованный результат
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hetzner-password-result-encrypted
          path: /tmp/hetzner-password-result.enc
          if-no-files-found: error
          retention-days: 1
