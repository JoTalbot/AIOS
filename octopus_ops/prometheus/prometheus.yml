global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'swarm_nodes'
    dns_sd_configs:
      - names:
          - tasks.node_exporter
        type: 'A'
        port: 9100


  - job_name: 'graphrag_api'
    static_configs:
      - targets: ['127.0.0.1:9760']
