groups:
  - name: aios-critical
    rules:
      - alert: AIOSDown
        expr: up{job="aios"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "AIOS API is down"
          description: "{{ $labels.instance }} has been down for >2 minutes"

      - alert: HighErrorRate
        expr: rate(aios_errors_total[5m]) / rate(aios_requests_total[5m]) > 0.05
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "AIOS error rate >5%"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(aios_response_time_seconds_bucket[5m])) > 1.0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "P95 latency >1s"
          description: "P95 latency is {{ $value }}s on {{ $labels.instance }}"

      - alert: OutboxBacklog
        expr: aios_outbox_pending > 100
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Outbox backlog"
          description: "{{ $labels.platform }} has {{ $value }} pending outbox entries"

      - alert: PhoneOffline
        expr: aios_phone_online == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Телефон G1 офлайн"
          description: "adb/companion недоступны >5 минут — проверьте телефон/WireGuard"

      - alert: PhoneBatteryLow
        expr: aios_phone_online == 1 and aios_phone_battery_percent < 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Батарея телефона <20%"
          description: "G1 на {{ $value }}% и, вероятно, не на зарядке"

      - alert: NoCardsCollected
        expr: rate(aios_cards_collected[30m]) == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "No cards collected in 30m"
          description: "{{ $labels.platform }} has not collected any cards in the last 30 minutes"

      - alert: AIOSShardWorkersDown
        expr: aios_shard_workers_active == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "All shard workers down"
          description: "No active shard workers on {{ $labels.instance }}"

      - alert: AIOSQueueBacklog
        expr: aios_queue_depth > 50
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Queue backlog growing"
          description: "{{ $labels.platform }} queue depth {{ $value }}"

      - alert: AIOSStaleClaims
        expr: aios_shard_stale_claims > 3
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Stale shard claims"
          description: "{{ $value }} stale claims on {{ $labels.instance }}"

      - alert: AIOSFleetExhausted
        expr: aios_free_devices == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Device fleet exhausted"
          description: "No free devices in fleet on {{ $labels.instance }}"

      - alert: AIOSOutboxApprovalLag
        expr: aios_outbox_pending_approval > 10
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Outbox approval lag"
          description: "{{ $value }} outbox items awaiting approval"

  - name: aios-telegram-llm
    rules:
      - alert: AIOSTelegramExporterDown
        expr: max by (job) (up{job="aios-telegram"}) == 0 or absent(up{job="aios-telegram"})
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Telegram/LLM metrics exporter is down"
          description: "The metrics endpoint has been unavailable for more than 3 minutes."

      - alert: AIOSTelegramCanaryFailed
        expr: aios_telegram_canary_ok == 0
        for: 12m
        labels: {severity: critical}
        annotations:
          summary: "Full Colab → Telegram canary is failing"
          description: "The latest silent sendMessage canary, route check, or auto-delete did not pass."

      - alert: AIOSTelegramCanaryStale
        expr: aios_telegram_canary_age_seconds < 0 or aios_telegram_canary_age_seconds > 900
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Telegram/Colab canary result is stale"
          description: "No fresh full canary result has been recorded for more than 15 minutes."

      - alert: AIOSTelegramAmbiguousDelivery
        expr: aios_telegram_queue_jobs{queue="outbox",status="failed_unknown"} > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Telegram delivery needs an operator decision"
          description: "At least one ambiguous send is waiting for explicit /resend ID review."

      - alert: AIOSTelegramGenerationBacklog
        expr: aios_telegram_queue_jobs{queue="generation",status="pending"} > 10
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Telegram LLM generation backlog"
          description: "More than 10 durable generation jobs have remained pending for 5 minutes."

      - alert: AIOSTelegramDeliverySLOLow
        expr: aios_telegram_delivery_success_ratio < 0.95 and sum(aios_telegram_delivery_events) >= 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Telegram delivery success ratio below 95%"
          description: "The rolling Telegram delivery success ratio has stayed below the SLO for 10 minutes."

      - alert: AIOSTelegramGenerationDeadLetter
        expr: aios_telegram_queue_jobs{queue="generation",status="dead_letter"} > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Telegram generation job moved to dead letter"
          description: "At least one generation job exhausted bounded retries and needs explicit operator review."

      - alert: AIOSAlertmanagerDeliveryCanaryFailed
        expr: aios_alertmanager_delivery_canary_ok == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Alertmanager end-to-end Telegram delivery canary failed"
          description: "The latest synthetic Alertmanager alert was not silently sent and deleted in the owner chat."

      - alert: AIOSAlertmanagerDeliveryCanaryStale
        expr: aios_alertmanager_delivery_canary_age_seconds < 0 or aios_alertmanager_delivery_canary_age_seconds > 5400
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Alertmanager delivery canary is stale"
          description: "No successful end-to-end Alertmanager Telegram canary has been recorded for 90 minutes."

      - alert: AIOSColabRecoverySLOMissed
        expr: aios_colab_recovery_slo_seconds > 0 and aios_colab_recovery_slo_met == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Latest Colab recovery missed its mode-specific SLO"
          description: "Inspect the recovery mode and stage timings before the next runtime outage."
