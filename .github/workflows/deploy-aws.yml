name: Deploy AWS Infrastructure & Services

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    # Runs only when the AWS role is configured (repo variable AWS_ROLE_ARN).
    # Without it the job is skipped and the workflow stays green.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.0"
          
      - name: Terraform Init & Apply
        working-directory: ./terraform/aws
        run: |
          terraform init
          terraform apply -auto-approve

  deploy-helm:
    name: Deploy Helm Chart to EKS
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-aios-role
          aws-region: eu-central-1
          
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region eu-central-1 --name aios-prod-cluster
        
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: '3.15.0'
          
      - name: Deploy AIOS via Helm
        run: |
          helm upgrade --install aios-prod ./helm/aios \
            --namespace production --create-namespace \
            --set image.repository=123456789012.dkr.ecr.eu-central-1.amazonaws.com/aios \
            --set image.tag=${{ github.sha }}
