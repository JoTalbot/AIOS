# Include inside the HTTPS server block for api.autosklo.org.ua.
# Dashboard v3 runs only on 127.0.0.1:8090 with NiceGUI root_path=/crm.

location = /crm {
    return 301 /crm/;
}

location /crm/ {
    auth_basic "AIOS CRM";
    auth_basic_user_file /etc/nginx/.htpasswd_aios_crm;

    # Strip /crm/ before proxying; NiceGUI emits browser paths under /crm.
    rewrite ^/crm/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
}
