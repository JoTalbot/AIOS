name: Full CI/CD — Android Emulators + Calibration + Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production server after tests'
        type: boolean
        default: false
      platform:
        description: 'Platform to calibrate (prom, bigl, shafa, all)'
        type: choice
        options: [all, prom, bigl, shafa]
        default: 'all'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /opt/android-sdk
  AVD_NAME: AIOS_Calibration
  API_LEVEL: "35"
  ABI: google_apis;x86_64
  EMULATOR_OPTS: "-no-snapshot-load -no-audio -no-boot-anim -gpu swiftshader_indirect -no-window"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------
  # 1. Lint & Unit Tests (fast, no emulator)
  # ---------------------------------------------------------
  lint-and-unit:
    # Legacy/advisory job; the blocking surface is core-gate.yml.
    continue-on-error: true
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff flake8 pytest pytest-asyncio pytest-cov

      - name: Check formatting (ruff)
        run: python -m ruff format --check .

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Lint (flake8)
        run: python -m flake8 aios_core/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests (no device)
        run: |
          python -m pytest -q \
            --ignore=tests/test_real_android_app.py \
            --ignore=tests/test_android_rpa_bridge.py \
            -k "not real_device" \
            --tb=short
        env:
          AIOS_FAST_TEST: "1"

      - name: Verify imports
        run: |
          python -c "import aios_core; print('Core OK')"
          python -c "from aios_core.platforms import list_platforms; print('Platforms:', [p.name for p in list_platforms()])"

  # ---------------------------------------------------------
  # 3. Calibration for Regional Platforms (prom, bigl, shafa)
  # ---------------------------------------------------------
  calibrate-platforms:
    name: Calibrate Regional Platforms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint-and-unit]
    # Manual dispatch only: needs live APKs (apkeep) + real app UIs.
    # Self-contained: every matrix leg brings up its own emulator
    # (emulator state cannot cross job boundaries on hosted runners).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false  # one platform's failure must not cancel the others
      matrix:
        platform: [prom, bigl, shafa]
        include:
          - platform: prom
            package: ua.prom
          - platform: bigl
            package: ua.bigl
          - platform: shafa
            package: com.shafa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bring up local emulator
        run: bash setup/ci-android-emulator.sh 1

      - name: Install apkeep (APK fetcher, best-effort)
        run: |
          if curl -fsSL "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu" -o /tmp/apkeep; then
            chmod +x /tmp/apkeep
            mkdir -p "$HOME/bin"
            mv /tmp/apkeep "$HOME/bin/apkeep"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            "$HOME/bin/apkeep" --version || true
          else
            echo "apkeep prebuilt unavailable — fetch-apk will degrade gracefully"
          fi

      - name: Fetch APK (if available via apkeep)
        run: |
          export PATH="${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          python aios_cli.py platforms fetch-apk ${{ matrix.package }} --out apks --source apkpure || echo "APK fetch failed, will use pre-installed"

      - name: Install APK on emulator
        if: always()
        run: |
          export PATH="${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          SERIAL="emulator-5554"
          APK_PATH="apks/${{ matrix.package }}.apk"
          if [ -f "$APK_PATH" ]; then
            adb -s $SERIAL install -r "$APK_PATH" || echo "Install failed, maybe already installed"
          else
            echo "APK not found, assuming pre-installed or manual step needed"
          fi

      - name: Generate calibration recipe (doctor --calibrate-recipe)
        id: recipe
        run: |
          python aios_cli.py platforms doctor --platform ${{ matrix.platform }} --calibrate-recipe > /tmp/recipe_${{ matrix.platform }}.json
          cat /tmp/recipe_${{ matrix.platform }}.json

      - name: Execute calibration dump collection
        run: |
          export PATH="${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          SERIAL="emulator-5554"

          # uiautomator dump can intermittently fail with
          # "ERROR: null root node returned by UiTestAutomationBridge"
          # (screen mid-transition), leaving no remote file and failing the
          # pull. Retry a few times; a screen that never dumps must warn,
          # not kill the leg — the other screens are still calibratable.
          dump_screen() {
            local name="$1"
            for attempt in 1 2 3; do
              if adb -s "$SERIAL" shell uiautomator dump "/sdcard/${name}.xml" \
                 && adb -s "$SERIAL" pull "/sdcard/${name}.xml" "/tmp/${name}.xml"; then
                return 0
              fi
              echo "dump ${name}: attempt ${attempt} failed, retrying..."
              sleep 2
            done
            echo "::warning::${name} dump failed after 3 attempts — continuing without it"
            return 0
          }

          # The recipe gives us exact ADB commands. We'll run the key ones:
          # 1. Open app
          adb -s $SERIAL shell am start -n ${{ matrix.package }}/.ui.main.MainActivity || true
          sleep 3

          # 2. Dump search screen
          dump_screen ${{ matrix.platform }}_search

          # 3. Dump detail screen (navigate to first item)
          adb -s $SERIAL shell input tap 160 200
          sleep 2
          dump_screen ${{ matrix.platform }}_detail

          # 4. Dump messenger screen
          adb -s $SERIAL shell input tap 160 500
          sleep 2
          dump_screen ${{ matrix.platform }}_messenger

          # 5. Dump navigation (home)
          adb -s $SERIAL shell input keyevent 3
          sleep 1
          dump_screen ${{ matrix.platform }}_navigation

      - name: Calibrate (write hints to YAML)
        run: |
          python aios_cli.py platforms calibrate \
            --platform ${{ matrix.platform }} \
            --dump /tmp/${{ matrix.platform }}_search.xml \
            --detail /tmp/${{ matrix.platform }}_detail.xml \
            --messages /tmp/${{ matrix.platform }}_messenger.xml \
            --navigation /tmp/${{ matrix.platform }}_navigation.xml \
            --write

      - name: Codegen (generate parser)
        run: |
          python aios_cli.py platforms codegen --platform ${{ matrix.platform }} --force

      - name: Bootup verification
        run: |
          python aios_cli.py platforms bootup \
            --platform ${{ matrix.platform }} \
            --package ${{ matrix.package }} \
            --dump /tmp/${{ matrix.platform }}_search.xml \
            --verify || echo "Bootup verification needs manual check"

      - name: Upload calibrated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calibrated-${{ matrix.platform }}
          path: |
            platforms/${{ matrix.platform }}.yaml
            aios_core/modules/${{ matrix.platform }}/
            /tmp/${{ matrix.platform }}_search.xml
            /tmp/${{ matrix.platform }}_detail.xml
            /tmp/${{ matrix.platform }}_messenger.xml
            /tmp/${{ matrix.platform }}_navigation.xml
            !**/__pycache__/**
          retention-days: 7

  # ---------------------------------------------------------
  # 4. Integration Tests with Emulators
  # ---------------------------------------------------------
  integration-tests:
    name: Integration Tests (with emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [calibrate-platforms]
    # Manual dispatch only. Self-contained: brings up its own emulator and
    # reuses the calibration dump XMLs uploaded by calibrate-platforms.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bring up local emulator
        run: bash setup/ci-android-emulator.sh 1

      - name: Download calibrated artifacts (dump XMLs)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: calibrated-*
          path: /tmp
          merge-multiple: true

      - name: Normalize dump XML locations
        run: |
          # upload-artifact lowers the least common ancestor to '/' for
          # absolute paths, so /tmp/prom_search.xml is stored as
          # tmp/prom_search.xml and downloads to /tmp/tmp/prom_search.xml.
          # Flatten back so marker-check can use /tmp/<platform>_*.xml.
          if ls /tmp/tmp/*.xml >/dev/null 2>&1; then
            cp /tmp/tmp/*.xml /tmp/
            ls -la /tmp/*.xml
          fi

      - name: Setup profiles (single local emulator)
        run: |
          export PATH="${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          for platform in prom bigl shafa; do
            python aios_cli.py profiles add --platform $platform --name ${platform}_ci --device emulator-5554
            python aios_cli.py devices lease --profile ${platform}:${platform}_ci
          done

      - name: Run AutoWatch cycle for each platform
        run: |
          for platform in prom bigl shafa; do
            echo "=== Testing $platform ==="
            python aios_cli.py platforms autowatch --platform $platform --profile ${platform}_ci --max 3 --no-collect || echo "AutoWatch failed for $platform"
          done

      - name: Run marker-check
        run: |
          for platform in prom bigl shafa; do
            python aios_cli.py platforms marker-check --platform $platform --dump /tmp/${platform}_search.xml || echo "Marker check failed for $platform"
          done

      - name: Run full pytest suite
        run: |
          python -m pytest -q --tb=short -x

  # ---------------------------------------------------------
  # 5. Production Autopilot Simulation (GA proof)
  # ---------------------------------------------------------
  production-simulation:
    name: Production Autopilot Simulation (GA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run 2-week simulation (accelerated)
        run: |
          python run_production_autopilot.py \
            --simulate-2weeks \
            --cycles-per-day 24 \
            --verbose \
            --output simulation_report.json

      - name: Verify GA criteria
        # Report schema from ProductionAutopilot.simulate_2_weeks():
        # all GA fields live under the top-level "simulation" object.
        run: |
          python -c "
          import json
          with open('simulation_report.json') as f:
            r = json.load(f)['simulation']
          assert r['ban_free'] == True, 'Bans detected!'
          assert r['ga_criteria_met'] == True, 'GA not met'
          assert r['avg_success_rate'] > 0.9, f'Success rate too low: {r[\"avg_success_rate\"]}'
          assert r['profiles'] >= 3, 'Need 3+ profiles'
          print('✅ GA criteria met: ban-free, success >90%, 3+ profiles')
          print(f'   Cycles: {r[\"total_cycles\"]}, Actions: {r[\"total_actions\"]}, Avg success: {r[\"avg_success_rate\"]:.1%}')
          "

      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        with:
          name: production-simulation-report
          path: simulation_report.json
          retention-days: 30

  # ---------------------------------------------------------
  # 6. Deploy to Production Server
  # ---------------------------------------------------------
  check-deploy-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verify SSH secrets exist
        id: check
        env:
          SEC_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SEC_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SEC_SSH_PRIVATE_KEY" ] || [ -z "$SEC_SSH_KNOWN_HOSTS" ]; then
            echo "SSH deploy secrets not configured — production deploy will be skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [integration-tests, production-simulation, check-deploy-secrets]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.deploy == 'true') && needs.check-deploy-secrets.outputs.configured == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          config: |
            Host traff.tplinkdns.com
              HostName traff.tplinkdns.com
              Port 2222
              User root
              StrictHostKeyChecking no

      - name: Deploy to server
        run: |
          ssh -p 2222 root@traff.tplinkdns.com << 'EOF'
            set -euo pipefail

            # Stop existing AIOS services
            cd /root/AIOS 2>/dev/null && docker-compose -f docker-compose.prod.yml down || true

            # Backup old repo
            mv /root/AIOS /root/AIOS.backup.$(date +%s) 2>/dev/null || true

            # Clone fresh
            git clone https://github.com/JoTalbot/AIOS.git /root/AIOS
            cd /root/AIOS

            # Install dependencies
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

            # Setup Android SDK if not present
            if [ ! -d "/opt/android-sdk" ]; then
              bash setup/android-emulator-env.sh
            fi

            # Start production stack
            docker-compose -f docker-compose.prod.yml up -d --build

            # Wait for health
            sleep 10
            curl -f http://localhost:8000/health || exit 1

            echo "✅ Deployment successful"
            docker-compose -f docker-compose.prod.yml ps
          EOF

      - name: Verify deployment health
        run: |
          ssh -p 2222 root@traff.tplinkdns.com "
            curl -s http://localhost:8000/health | jq .
            curl -s http://localhost:8000/metrics | grep -E 'aios_production|aios_cards_collected|aios_drift_events'
          "

  # ---------------------------------------------------------
  # 7. Notify (Slack/Discord/Email)
  # ---------------------------------------------------------
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint-and-unit, calibrate-platforms, integration-tests, production-simulation, deploy]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          FAILED=false
          for result in ${{ needs.lint-and-unit.result }} ${{ needs.calibrate-platforms.result }} ${{ needs.integration-tests.result }} ${{ needs.production-simulation.result }} ${{ needs.deploy.result }}; do
            r=$(echo "$result" | tr '[:upper:]' '[:lower:]')
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              FAILED=true
            fi
          done
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Send notification
        if: ${{ steps.status.outputs.failed == 'true' || github.event_name == 'push' }}
        run: |
          STATUS="${{ steps.status.outputs.failed }}"
          if [ "$STATUS" = "true" ]; then
            MSG="❌ AIOS CI/CD FAILED"
            COLOR="danger"
          else
            MSG="✅ AIOS CI/CD PASSED"
            COLOR="good"
          fi

          # Example for Slack webhook (add SLACK_WEBHOOK to secrets)
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"$MSG\", \"attachments\":[{\"color\":\"$COLOR\",\"fields\":[{\"title\":\"Repo\",\"value\":\"JoTalbot/AIOS\",\"short\":true},{\"title\":\"Branch\",\"value\":\"${{ github.ref }}\",\"short\":true},{\"title\":\"Commit\",\"value\":\"${{ github.sha }}\",\"short\":true},{\"title\":\"Run\",\"value\":\"https://github.com/JoTalbot/AIOS/actions/runs/${{ github.run_id }}\",\"short\":true}]}]}" \
              ${{ secrets.SLACK_WEBHOOK }}
          fi

          echo "$MSG"
